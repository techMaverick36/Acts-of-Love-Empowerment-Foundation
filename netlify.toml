[build]
  command = "npm run build"
  publish = "dist"

# Routing rules are generated into dist/_redirects by scripts/prerender.mjs
# (one rewrite per prerendered page, an SPA fallback for /admin and new blog
# posts, and a real 404 for everything else).

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
